<script>
document.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.querySelector("#quarto-margin-sidebar");
  const posts = Array.from(document.querySelectorAll(".quarto-listing-default .quarto-post"));
  const listing = window["quarto-listings"]?.["listing-listing"];

  if (!sidebar || posts.length === 0 || !listing) return;

  const archive = new Map();
  let activeMonth = "";

  posts.forEach((post) => {
    const date = post.querySelector(".listing-date")?.textContent.trim();
    const match = date?.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return;

    const [, year, month] = match;
    const months = archive.get(year) || new Map();
    const entry = months.get(month) || { count: 0 };

    entry.count += 1;
    months.set(month, entry);
    archive.set(year, months);
    post.dataset.archiveMonth = `${year}-${month}`;
  });

  if (archive.size === 0) return;

  const section = document.createElement("section");
  section.className = "quarto-listing-archive";

  const title = document.createElement("h5");
  title.className = "quarto-listing-archive-title";
  title.textContent = "Archives";
  section.appendChild(title);

  const allList = document.createElement("ul");
  allList.className = "quarto-listing-archive-months quarto-listing-archive-all";

  const allItem = document.createElement("li");
  const allButton = document.createElement("button");
  allButton.type = "button";
  allButton.className = "quarto-archive-filter active";
  allButton.dataset.archiveMonth = "";
  allButton.setAttribute("aria-pressed", "true");
  allButton.textContent = "All dates";

  const allCount = document.createElement("span");
  allCount.className = "quarto-archive-count";
  allCount.textContent = ` (${posts.length})`;

  allButton.appendChild(allCount);
  allItem.appendChild(allButton);
  allList.appendChild(allItem);
  section.appendChild(allList);

  archive.forEach((months, year) => {
    const yearLabel = document.createElement("div");
    yearLabel.className = "quarto-listing-archive-year";
    yearLabel.textContent = year;
    section.appendChild(yearLabel);

    const monthList = document.createElement("ul");
    monthList.className = "quarto-listing-archive-months";

    months.forEach(({ count }, month) => {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "quarto-archive-filter";
      button.dataset.archiveMonth = `${year}-${month}`;
      button.setAttribute("aria-pressed", "false");
      button.textContent = new Intl.DateTimeFormat("en", { month: "long" })
        .format(new Date(2000, Number(month) - 1, 1));

      const countLabel = document.createElement("span");
      countLabel.className = "quarto-archive-count";
      countLabel.textContent = ` (${count})`;

      button.appendChild(countLabel);
      item.appendChild(button);
      monthList.appendChild(item);
    });

    section.appendChild(monthList);
  });

  sidebar.appendChild(section);

  const decodeCategory = (value) => {
    if (!value) return "";
    return decodeURIComponent(atob(value));
  };

  const applyCombinedFilter = () => {
    const activeCategory = document
      .querySelector(".quarto-listing-category .category.active")
      ?.getAttribute("data-category") || "";
    const category = decodeCategory(activeCategory);

    listing.filter((item) => {
      const values = item.values();
      const dateMatches = !activeMonth || item.elm?.dataset.archiveMonth === activeMonth;
      const categories = decodeCategory(values.categories).split(",");
      const categoryMatches = !category || categories.includes(category);
      return dateMatches && categoryMatches;
    });
  };

  const selectMonth = (month) => {
    activeMonth = month;

    section.querySelectorAll(".quarto-archive-filter").forEach((button) => {
      const isActive = button.dataset.archiveMonth === activeMonth;
      button.classList.toggle("active", isActive);
      button.setAttribute("aria-pressed", String(isActive));
    });

    applyCombinedFilter();
  };

  section.addEventListener("click", (event) => {
    const button = event.target.closest(".quarto-archive-filter");
    if (!button) return;
    selectMonth(button.dataset.archiveMonth || "");
  });

  document.addEventListener("click", (event) => {
    if (event.target.closest(
      ".quarto-listing-category, .quarto-listing-category-title, .listing-category"
    )) {
      setTimeout(applyCombinedFilter, 0);
    }
  });

  window.addEventListener("hashchange", () => {
    setTimeout(applyCombinedFilter, 0);
  });
});
</script>
